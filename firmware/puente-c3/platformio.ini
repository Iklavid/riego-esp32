; Puente de radio + Nodo 1 - ESP32-C3
;  - Por cable:  pio run -e esp32-c3 -t upload
;  - Por WiFi:   pio run -e ota -t upload   (contrasena en RIEGO_OTA_PASS)
[env:esp32-c3]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_filters =
    esp32_exception_decoder

lib_deps =
    knolleary/PubSubClient @ ^2.8

[env:ota]
extends = env:esp32-c3
upload_protocol = espota
upload_port = riego-puente.local
upload_flags = --auth=${sysenv.RIEGO_OTA_PASS}

; ---- Nodo 2 con WiFi: hace de puente pequeno (MQTT + aviso ESP-NOW + reenvio de otros nodos)
;  - Por cable (la primera vez):  pio run -e nodo2 -t upload
;  - Por WiFi:                    pio run -e nodo2-ota -t upload
[env:nodo2]
extends = env:esp32-c3
build_flags =
    ${env:esp32-c3.build_flags}
    '-D HOSTNAME="riego-nodo2"'
    '-D TOPIC_BASE="riego/puente2"'
    '-D CLIENT_ID="RiegoNodo2"'
    -D NODO_LOCAL_ID=2
    -D PIN_SENSOR_TIERRA=4
    -D RF_RX_ACTIVO=0
    -D PIN_RF_TX=2
    -D TX_POWER=60
    -D ESPNOW_LR=1
    -D SONDA_SECO=3822
    -D SONDA_MOJADO=1415

[env:nodo2-ota]
extends = env:nodo2
upload_protocol = espota
upload_port = riego-nodo2.local
upload_flags = --auth=${sysenv.RIEGO_OTA_PASS}

; Central de riego ESP32-S3
;  - Por cable:  pio run -e esp32-s3-devkitc-1 -t upload
;  - Por WiFi:   pio run -e ota -t upload
;    (la contrasena OTA se lee de la variable RIEGO_OTA_PASS; si el nombre
;     riego-s3.local no se encuentra, anade:  --upload-port <IP de la placa>)
[env:esp32-s3-devkitc-1]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Particiones con dos huecos de programa de 1,9 MB (necesarios para OTA)
board_build.partitions = min_spiffs.csv

lib_deps =
  knolleary/PubSubClient
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  adafruit/Adafruit ILI9341
  adafruit/Adafruit GFX Library
  paulstoffregen/XPT2046_Touchscreen
  lvgl/lvgl@~8.3.11
  bblanchon/ArduinoJson@^7.2.0

build_flags =
  -D LV_CONF_SKIP=1
  -D LV_COLOR_DEPTH=16
  -D LV_TICK_CUSTOM=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = riego-s3.local
upload_flags = --auth=${sysenv.RIEGO_OTA_PASS}

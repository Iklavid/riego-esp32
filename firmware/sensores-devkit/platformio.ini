; Placa de sensores (lluvia + nivel + valvula 9) - ESP32 DevKit
;  - Por cable:  pio run -e esp32dev -t upload
;  - Por WiFi:   pio run -e ota -t upload   (contrasena en RIEGO_OTA_PASS)
[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient

[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = riego-sensores.local
upload_flags = --auth=${sysenv.RIEGO_OTA_PASS}

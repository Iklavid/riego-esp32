; Nodos de humedad N3-N5 y repetidor ESP-NOW - ESP32-C3
;  - Nodo 3:     pio run -e nodo3 -t upload
;  - Repetidor:  pio run -e repetidor -t upload   (placa del nodo 4, sin sonda)
[env:airm2m_core_esp32c3]
platform = espressif32@6.5.0
board = airm2m_core_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    sui77/rc-switch @ ^2.6.4

[env:nodo3]
extends = env:airm2m_core_esp32c3
build_flags =
    ${env:airm2m_core_esp32c3.build_flags}
    -D NODO_ID=3
    -D ESPNOW_LR=1
    -D MODO_REPETIDOR=0
    -D SONDA_SECO=3830
    -D SONDA_MOJADO=1410

[env:repetidor]
extends = env:airm2m_core_esp32c3
build_flags =
    ${env:airm2m_core_esp32c3.build_flags}
    -D NODO_ID=4
    -D ESPNOW_LR=1
    -D MODO_REPETIDOR=1

; Para calibrar la sonda del nodo 3: escala completa (bruto = 4095 - % * 40,95). Calibrada 07-11-2026
[env:nodo3-calibrar]
extends = env:airm2m_core_esp32c3
build_flags =
    ${env:airm2m_core_esp32c3.build_flags}
    -D NODO_ID=3
    -D ESPNOW_LR=1
    -D MODO_REPETIDOR=0
    -D SONDA_SECO=4095
    -D SONDA_MOJADO=0

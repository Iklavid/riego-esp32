# =====================================================================
#  Mosquitto - broker MQTT del riego (Mac)
#  Sustituye a amqtt. Las contrasenas y datos van FUERA del proyecto,
#  Copia de trabajo en ~/.riego/mosquitto/mosquitto.conf (la instala instalar_mac.sh).
#  en ~/.riego/mosquitto (no se sincronizan ni suben a Git).
# =====================================================================

# Fase de pruebas: puerto 1884, en paralelo con amqtt (1883).
# Cuando todo funcione, se cambia a 1883 y se apaga amqtt.
listener 1884 0.0.0.0

# Nadie entra sin usuario y contrasena
allow_anonymous false
password_file /Users/TU_USUARIO/.riego/mosquitto/passwd
acl_file /Users/TU_USUARIO/.riego/mosquitto/acl

# Guarda en disco los mensajes retenidos (estado de valvulas, sensores,
# programas...) para que sobrevivan a un reinicio del broker
persistence true
persistence_location /Users/TU_USUARIO/.riego/mosquitto/data/
autosave_interval 300

# Registro
log_dest file /Users/TU_USUARIO/.riego/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%d %H:%M:%S
connection_messages true

# Limites para que una placa con problemas no tumbe el broker
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 65536
max_keepalive 300
